[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "followme-bot"
version = "0.1.0"
description = "A follow-me robot brain: person tracking, re-identification, obstacle avoidance, and a simulator to prove it."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Vedant Parnaik" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/vedantparnaik/followme-bot"

[project.optional-dependencies]
sim = ["matplotlib>=3.5", "pillow>=9"]
robot = ["opencv-python>=4.7", "ultralytics>=8.0"]
dev = ["pytest>=7", "matplotlib>=3.5", "pillow>=9"]

[tool.setuptools]
packages = ["followme", "simkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
